site_name: QualityClean
site_description: Fast, automated data cleaning for Polars DataFrames.
site_author: Zeo
site_url: https://justzeo.github.io/qualityclean/

repo_name: JustZeo/qualityclean
repo_url: https://github.com/JustZeo/qualityclean

copyright: |
  © 2026 Zeo • Released under the MIT License

theme:
  name: material

  language: en


  icon:
    repo: fontawesome/brands/github

  palette:

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  features:

    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - navigation.path

    # Search
    - search.highlight
    - search.suggest
    - search.share

    # TOC
    - toc.follow
    - toc.integrate

    # Code
    - content.code.copy
    - content.code.select
    - content.code.annotate

    # UX
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

markdown_extensions:

  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite

  - pymdownx.superfences

  - pymdownx.magiclink

  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.tasklist:
      custom_checkbox: true

  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:

  generator: false

  social:

    - icon: fontawesome/brands/github
      link: https://github.com/JustZeo

    - icon: fontawesome/brands/python
      link: https://pypi.org/project/qualityclean/

nav:

  - Home: index.md

  - Getting Started:
      - Getting Started: getting-started.md
      - Installation: installation.md
      - Quick Start: quickstart.md

  - API Reference:
      - load(): api/load.md
      - clean(): api/clean.md
      - audit(): api/audit.md
      - export(): api/export.md

  - Cleaning Rules:
      - Column Rule: rules/column-rule.md
      - Whitespace Rule: rules/whitespace-rule.md
      - Empty Rule: rules/empty-rule.md
      - Datatype Rule: rules/datatype-rule.md
      - Missing Rule: rules/missing-rule.md
      - Duplicate Rule: rules/duplicate-rule.md

  - Examples:
      - CSV Workflow: examples/csv.md
      - Parquet Workflow: examples/parquet.md
      - Custom Pipeline: examples/custom-pipeline.md

  - Contributing: contributing.md